[bar.default]
end = [ "media", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
font_family = "JetBrainsMono Nerd Font"
margin_ends = 0
radius = 0
start = [ "launcher", "workspaces" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[shell]
font_family = "JetBrainsMono Nerd Font"

[theme]
builtin = "Ayu"
source = "wallpaper"

[wallpaper]
directory = "/home/adam/nixos-dotfiles"

    [wallpaper.default]
    path = "/home/adam/nixos-dotfiles/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/adam/nixos-dotfiles/wallpaper.jpg"

[widget.network]
show_label = false
